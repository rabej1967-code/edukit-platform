name: Keep Supabase Alive

# Jalan setiap 3 hari (jauh sebelum had 7 hari Supabase),
# + boleh trigger manual bila-bila masa dari tab "Actions" di GitHub
on:
  schedule:
    - cron: '0 3 */3 * *'   # 3:00 AM UTC, setiap 3 hari
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping semua projek Supabase
        run: |
          echo "## Hasil Keep-Alive Supabase" >> $GITHUB_STEP_SUMMARY
          echo "| Projek | Ref | Kod HTTP | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          ping_project() {
            NAME="$1"
            REF="$2"
            KEY="$3"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://${REF}.supabase.co/rest/v1/" \
              -H "apikey: ${KEY}")
            if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "404" ]; then
              STATUS="OK (server hidup)"
            else
              STATUS="BERMASALAH"
              echo "::error::${NAME} (${REF}) - kod HTTP: ${CODE} - server mungkin tak reachable"
            fi
            echo "| ${NAME} | ${REF} | ${CODE} | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
            echo "${NAME} (${REF}): HTTP ${CODE} - ${STATUS}"
          }

          ping_project "EduKit utama" "aowzftmdriukxbltjtpm" "${{ secrets.SUPABASE_ANON_KEY_EDUKIT }}"
          ping_project "SPIn Analytics" "icrssjqyyhnlkpxbyjfp" "${{ secrets.SUPABASE_ANON_KEY_SPIN }}"
          ping_project "Agihbeban" "ylnxazqxtgyiynwcfxkj" "${{ secrets.SUPABASE_ANON_KEY_AGIHBEBAN }}"

          echo "Selesai. Sila semak tab Summary untuk jadual penuh."
